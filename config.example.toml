# MailSweep configuration.
# Copy to ~/.config/mailsweep/config.toml and edit.

[mail]
# Apple Mail account names to scan, exactly as they appear in Mail.app's
# sidebar / Settings > Accounts. Leave empty to scan every enabled account.
# Your Proton account appears here too once Proton Mail Bridge is running
# and the account is added to Mail.app.
accounts = []          # e.g. ["Personal", "Work", "Proton"]

# How many days back to scan on each run. First run can be larger (e.g. 30)
# to seed sender statistics; daily runs only re-process unseen messages.
lookback_days = 7

# Max messages pulled per mailbox per run (safety valve for huge inboxes).
max_messages = 400

[model]
# Ollama endpoint and model. Install: https://ollama.com then
#   ollama pull llama3.2:3b
host = "http://localhost:11434"
name = "llama3.2:3b"
# Seconds to wait for a single classification before falling back to rules.
timeout = 30
# If false, skip the LLM entirely and use rules only.
enabled = true

[calendar]
# Calendar names to cross-check detected events against (to avoid flagging
# events you already have). Leave empty to check all calendars.
calendars = []
# When you approve a detected event, it is created on this calendar.
target_calendar = "Home"
# Days ahead to look when checking whether an event already exists.
horizon_days = 60

[unsubscribe]
# never | http_get | one_click
# one_click performs RFC 8058 POST for approved senders that support it;
# anything else opens the unsubscribe URL in your browser for you to finish.
mode = "one_click"
# Senders matching these substrings are never suggested for unsubscribe.
protected = []         # e.g. ["@utah.edu", "billing@"]

[digest]
# Where the HTML digest is written.
output_dir = "~/MailSweep"
# Also print a terminal summary after runs.
terminal = true

[spam_audit]
# Scan each account's Junk/Spam folder for mail that shouldn't be there, and
# queue it for your review (mailsweep spam review) instead of leaving it to
# rot unseen. The only exception is a sender you've explicitly marked
# trusted (mailsweep spam trust <email>, or "a" during review) -- their
# Junk mail is auto-moved to the Inbox with no review step. Everything else
# just gets queued; nothing else moves without your approval.
enabled = true
# Beyond the built-in receipt/security/financial subject patterns, also ask
# the local LLM (when reachable) whether a non-matching message looks like
# it was misfiled -- widens what gets surfaced at the cost of some scan time.
llm_review = true
# Cap on LLM calls per scan, so a large Junk folder doesn't turn a scan into
# a long batch of model calls.
llm_max_per_scan = 40

[purchases]
# Sweep order-confirmation/shipping/delivery/return emails, resolve item
# names via the LLM (falling back to raw HTML when plain-text is too
# generic), and draft short reviews for items that look delivered
# (mailsweep purchases scan / list / review / export). Read-only.
enabled = true
# How many days back to sweep.
lookback_days = 60
# Mailboxes to sweep per account -- Trash is included by default since
# delivery/return confirmations sometimes end up auto-filed or trashed.
mailboxes = ["INBOX", "Trash"]
